name: Build

# Every PR and every push to main: build (warnings are errors), run the tests,
# check the version is consistent, and make sure the installer script compiles.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the privacy check reads the PR's commit authors

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: No personal identifiers (paths, e-mails, commit authors)
        shell: pwsh
        run: ./tools/check-privacy.ps1 -Range "${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || '' }}"

      - name: Version is consistent
        shell: pwsh
        run: ./tools/check-version.ps1

      - name: Restore
        run: dotnet restore OnTop.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build OnTop.sln -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test OnTop.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Installer script compiles
        shell: pwsh
        run: ./tools/build-installer.ps1 -OutDir "$env:RUNNER_TEMP\installer"
